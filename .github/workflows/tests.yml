name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Comprobar sintaxis de la CLI y los scripts
        run: python -m compileall -q origen scripts chat.py chat_origen_v2.py train.py train_origen_v2.py
      - name: Ejecutar pruebas
        env:
          OMP_NUM_THREADS: "2"
        run: python -m unittest discover -s tests -v
